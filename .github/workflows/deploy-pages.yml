name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Playwright browser download plus three suites plus the build; 15 minutes
    # was tight on a cold runner.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browsers
        # The accessibility and journey suites drive real browsers. Without this
        # they fail on a clean runner with "Executable doesn't exist".
        # Chromium and WebKit only — the suites do not use Firefox.
        run: npx playwright install --with-deps chromium webkit

      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:a11y
          npm run test:e2e

      - name: Upload test report on failure
        # Job logs need admin rights to read through the API, which made a
        # failing suite effectively undiagnosable from outside the UI. The
        # report artifact is readable by anyone who can see the run.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.job }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build static export
        # Deliberately scoped to this step, NOT the workflow.
        #
        # As workflow-level `env` these also applied to the Verify step, whose
        # Playwright suites build and serve the site themselves and then
        # navigate to `/`, `/buy/`, and so on. A base-path build served at the
        # root 404s on every one of those, so the whole suite failed and the
        # deploy never ran. Only the artifact that ships needs the subpath.
        #
        # Both values must change together if the repo is renamed, moved to a
        # user site, or given a custom domain — see
        # handoff/MAINTENANCE_RUNBOOK.md.
        env:
          NEXT_PUBLIC_SITE_URL: https://andrewibrah.github.io
          NEXT_PUBLIC_BASE_PATH: /YourlocalRealtor
        run: npm run build

      - name: Confirm export
        run: test -f out/index.html

      - name: Confirm assets are prefixed for the Pages subpath
        # A project Pages site 404s on every asset if basePath is not applied.
        # Cheaper to catch here than after a deploy.
        run: |
          grep -q 'href="/YourlocalRealtor/_next/' out/index.html \
            || grep -q 'src="/YourlocalRealtor/_next/' out/index.html \
            || { echo "::error::Built assets are not prefixed with the base path"; exit 1; }
          echo "Base path applied."

      # `actions/configure-pages` is deliberately not used.
      #
      # Two reasons. It calls the Pages API and so needs a `pages` permission,
      # which this build job does not have and should not have — only the deploy
      # job carries deploy scope. And with `static_site_generator: next` it
      # injects its own basePath/assetPrefix handling, which would fight the
      # explicit basePath this project sets in next.config.ts. Neither
      # `upload-pages-artifact` nor `deploy-pages` requires it once Pages is
      # enabled with GitHub Actions as the source.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
