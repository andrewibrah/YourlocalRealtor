name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # Project Pages site: served from https://andrewibrah.github.io/YourlocalRealtor/
  # Both must change together if the repo is renamed, moved to a user site, or
  # given a custom domain — see handoff/MAINTENANCE_RUNBOOK.md.
  NEXT_PUBLIC_SITE_URL: https://andrewibrah.github.io
  NEXT_PUBLIC_BASE_PATH: /YourlocalRealtor

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install locked dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:a11y
          npm run test:e2e

      - name: Build static export
        run: npm run build

      - name: Confirm export
        run: test -f out/index.html

      - name: Confirm assets are prefixed for the Pages subpath
        # A project Pages site 404s on every asset if basePath is not applied.
        # Cheaper to catch here than after a deploy.
        run: |
          grep -q 'href="/YourlocalRealtor/_next/' out/index.html \
            || grep -q 'src="/YourlocalRealtor/_next/' out/index.html \
            || { echo "::error::Built assets are not prefixed with the base path"; exit 1; }
          echo "Base path applied."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
